name: Publish to crates.io

on:
  release:
    types:
      - published

jobs:
  publish:
    name: Publish workspace crates to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --all-targets --verbose

      - name: Dry run publish derive crate
        working-directory: derive
        run: cargo publish --dry-run

      - name: Publish derive crate
        working-directory: derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Read derive crate version
        id: derive_version
        working-directory: derive
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Wait for crates.io index to include derive crate version
        env:
          EXPECTED_VERSION: ${{ steps.derive_version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            response=$(curl -fsSL https://crates.io/api/v1/crates/ros-cmake-parser-derive)
            if echo "$response" | jq -e --arg version "$EXPECTED_VERSION" '.versions[].num == $version' >/dev/null; then
              echo "ros-cmake-parser-derive $EXPECTED_VERSION is now visible on crates.io"
              exit 0
            fi
            echo "Waiting for ros-cmake-parser-derive $EXPECTED_VERSION to appear on crates.io (attempt ${attempt}/40)"
            sleep 15
          done
          echo "Timed out waiting for ros-cmake-parser-derive $EXPECTED_VERSION to appear on crates.io" >&2
          exit 1

      - name: Dry run publish library crate
        working-directory: lib
        run: cargo publish --dry-run

      - name: Publish library crate
        working-directory: lib
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
