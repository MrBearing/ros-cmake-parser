name: Publish to crates.io

on:
  release:
    types:
      - published

jobs:
  publish:
    name: Publish workspace crates to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --all-targets --verbose

      - name: Dry run publish derive crate
        working-directory: derive
        run: cargo publish --dry-run

      - name: Preflight library packaging
        working-directory: lib
        run: cargo package --allow-dirty

      - name: Publish derive crate
        working-directory: derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Wait until library crate resolves on publish dry-run
        working-directory: lib
        run: |
          set -uo pipefail
          for attempt in $(seq 1 40); do
            if cargo publish --dry-run; then
              echo "Library crate is ready to publish"
              exit 0
            fi
            echo "Waiting for derive crate version to become resolvable (attempt ${attempt}/40)"
            sleep 15
          done
          echo "Timed out waiting for library crate dry-run to succeed" >&2
          exit 1

      - name: Publish library crate
        working-directory: lib
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
